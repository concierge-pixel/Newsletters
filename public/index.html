<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Review Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- LOGIN -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <svg class="logo" viewBox="0 0 40 40" aria-label="Review Portal logo" fill="none">
        <rect x="6" y="5" width="22" height="30" rx="3" stroke="currentColor" stroke-width="2.5"/>
        <path d="M12 14h10M12 20h10M12 26h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="30" cy="28" r="7" fill="var(--accent)"/>
        <path d="m27 28 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Blog Review Portal</h1>
      <p class="muted">Enter your password to review blog drafts.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <svg class="logo sm" viewBox="0 0 40 40" aria-hidden="true" fill="none">
          <rect x="6" y="5" width="22" height="30" rx="3" stroke="currentColor" stroke-width="2.5"/>
          <path d="M12 14h10M12 20h10M12 26h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="30" cy="28" r="7" fill="var(--accent)"/>
        </svg>
        <span>Blog Review</span>
      </div>
      <div class="top-actions">
        <a class="btn btn-ghost" href="/blog" target="_blank">View live blog ↗</a>
        <button id="upload-open" class="btn btn-primary" hidden>+ Upload draft</button>
        <button id="logout" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="filters" role="tablist">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="pending">To review</button>
          <button class="chip" data-filter="changes">Changes</button>
          <button class="chip" data-filter="published">Live</button>
        </div>
        <ul id="post-list" class="post-list"></ul>
      </aside>

      <main class="preview">
        <div id="empty" class="empty">
          <h2>Select a draft</h2>
          <p class="muted">Pick a post on the left to preview it.</p>
        </div>

        <div id="detail" hidden>
          <div class="detail-head">
            <div>
              <h2 id="d-title"></h2>
              <p class="muted" id="d-meta"></p>
            </div>
            <div class="device-toggle">
              <button class="chip active" data-width="100%">Desktop</button>
              <button class="chip" data-width="390px">Mobile</button>
            </div>
          </div>

          <div class="frame-wrap"><iframe id="frame" title="Draft preview" sandbox="allow-same-origin allow-popups"></iframe></div>

          <section class="review">
            <div id="d-notes" class="notes" hidden></div>
            <h3>Comments</h3>
            <ul id="d-comments" class="comments"></ul>
            <div id="actions">
              <textarea id="comment" rows="3" placeholder="Leave feedback (required if you request changes)…"></textarea>
              <div class="action-row">
                <button id="btn-changes" class="btn btn-outline">Request changes</button>
                <button id="btn-approve" class="btn btn-success">Approve &amp; publish</button>
                <button id="btn-delete" class="btn btn-danger" hidden>Delete</button>
              </div>
            </div>
            <p id="live-link" class="live" hidden></p>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- UPLOAD DIALOG (admin) -->
  <dialog id="upload-dialog">
    <form id="upload-form" method="dialog">
      <h2>Upload a draft</h2>
      <label for="u-file">HTML file</label>
      <input id="u-file" name="file" type="file" accept=".html,.htm" required />
      <label for="u-title">Title <span class="muted">(optional — uses &lt;title&gt; from the file)</span></label>
      <input id="u-title" name="title" type="text" />
      <label for="u-notes">Note for your client <span class="muted">(optional)</span></label>
      <textarea id="u-notes" name="notes" rows="3"></textarea>
      <p class="muted small">Uploading a file with the same title creates a new version of that post.</p>
      <div class="action-row">
        <button type="button" id="upload-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Upload</button>
      </div>
      <p id="upload-error" class="error" role="alert"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
