<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Correos y Blog · Revisión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <!-- PORTADA: lista de correos y artículos -->
  <div id="portada">
    <header class="cabecera">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="6" y="5" width="22" height="30" rx="3" stroke="currentColor" stroke-width="2.5" />
        <path d="M12 14h10M12 20h10M12 26h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="30" cy="28" r="7" fill="var(--acento)" />
        <path d="m27 28 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Correos y Blog</h1>
      <p class="subtitulo">Aquí puedes ver los correos y artículos preparados para ti. Haz clic en cualquiera para verlo completo.</p>
    </header>

    <nav class="pestanas" aria-label="Filtrar contenido">
      <button type="button" class="pestana" data-filtro="todo" aria-pressed="true">Todo <span></span></button>
      <button type="button" class="pestana" data-filtro="correo" aria-pressed="false">Correos <span></span></button>
      <button type="button" class="pestana" data-filtro="blog" aria-pressed="false">Blog <span></span></button>
    </nav>

    <main>
      <div id="lista" class="rejilla"></div>
      <p id="vacio" class="vacio" hidden></p>
    </main>
  </div>

  <!-- VISOR: un correo o artículo a pantalla completa -->
  <div id="visor" class="visor" hidden>
    <div class="visor-barra">
      <button type="button" id="cerrar" class="boton">← Volver</button>
      <div class="visor-titulo">
        <span id="visor-etiqueta" class="etiqueta"></span>
        <h2 id="visor-nombre"></h2>
      </div>
      <div class="visor-acciones">
        <div class="dispositivo" role="group" aria-label="Tamaño de pantalla">
          <button type="button" class="pestana" data-ancho="100%" aria-pressed="true">Escritorio</button>
          <button type="button" class="pestana" data-ancho="390px" aria-pressed="false">Móvil</button>
        </div>
        <a id="comentar" class="boton" hidden>Enviar comentarios</a>
        <a id="abrir" class="boton" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
      </div>
    </div>
    <div class="visor-marco">
      <iframe id="marco" title="Vista previa"></iframe>
    </div>
  </div>

  <script src="contenido.js"></script>
  <script src="app.js"></script>
</body>
</html>
