# Render settings (Web Service). If you create the service by hand in the dashboard, use the same values:
# Build Command = npm install · Start Command = npm start · Environment: GITHUB_TOKEN (STUDIO_PASSWORD optional)
services:
  - type: web
    runtime: node
    name: megabliss-preview
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_TOKEN
        sync: false
